<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>MusicTerra - Découvrez 150+ Genres Musicaux du Monde Entier</title>
    <meta name="title" content="MusicTerra - Découvrez 150+ Genres Musicaux du Monde Entier">
    <meta name="description" content="Explorez plus de 150 genres musicaux du monde entier : Indie Rock, K-Pop, Jazz, Metal, Hip Hop et bien plus. Histoire, artistes emblématiques et playlists Spotify pour chaque genre.">
    <meta name="keywords" content="genres musicaux, musique mondiale, indie rock, k-pop, jazz, metal, hip hop, reggae, blues, découverte musicale, playlists spotify, histoire de la musique">
    <meta name="author" content="MusicTerra">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://musicterra.vercel.app">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MusicTerra">
    <meta property="og:title" content="MusicTerra - 150+ Genres Musicaux du Monde">
    <meta property="og:description" content="Explorez les genres musicaux du monde entier avec leur histoire, artistes et playlists Spotify">
    <meta property="og:url" content="https://musicterra.vercel.app">
    <meta property="og:locale" content="fr_FR">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MusicTerra - Genres Musicaux du Monde">
    <meta name="twitter:description" content="Découvrez 150+ genres musicaux avec histoire et playlists">

    <!-- Structured Data - Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MusicTerra",
      "alternateName": "Music Terra",
      "url": "https://musicterra.vercel.app",
      "description": "Plateforme de découverte de genres musicaux du monde entier avec histoire, artistes et playlists",
      "inLanguage": ["fr", "en"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://musicterra.vercel.app/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data - ItemList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Genres Musicaux du Monde",
      "description": "Collection complète des genres musicaux mondiaux",
      "numberOfItems": 150,
      "itemListElement": [
        {
          "@type": "MusicGenre",
          "name": "Indie Rock",
          "description": "Rock indépendant émergé dans les années 1980",
          "url": "https://musicterra.vercel.app/#indie-rock"
        },
        {
          "@type": "MusicGenre",
          "name": "K-Pop",
          "description": "Pop coréenne, phénomène musical mondial",
          "url": "https://musicterra.vercel.app/#k-pop"
        },
        {
          "@type": "MusicGenre",
          "name": "Heavy Metal",
          "description": "Metal britannique des années 1970",
          "url": "https://musicterra.vercel.app/#heavy-metal"
        },
        {
          "@type": "MusicGenre",
          "name": "Jazz",
          "description": "Genre musical né aux États-Unis",
          "url": "https://musicterra.vercel.app/#jazz"
        },
        {
          "@type": "MusicGenre",
          "name": "Hip Hop",
          "description": "Culture urbaine née à New York",
          "url": "https://musicterra.vercel.app/#hip-hop"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
